name: Publish
run-name: Publish ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    name: Check publication revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_publish: ${{ steps.validate.outputs.should_publish }}
      superseded: ${{ steps.validate.outputs.superseded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Avoid publishing an already published revision
        id: validate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { shouldPublish } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dependabot-auto-merge.mjs`);
            await shouldPublish({ github, context, core });

  publish-current-main:
    needs: validate
    if: needs.validate.outputs.superseded == 'true'
    name: Request publication of current main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { dispatchPublish } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dependabot-auto-merge.mjs`);
            await dispatchPublish({ github, context, core, mergeCommitSha: context.sha });

  build:
    needs: validate
    if: needs.validate.outputs.should_publish == 'true' && github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0
      - name: Run unit tests
        run: |
          dotnet build tests/Api.Tests/Api.Tests.csproj
          dotnet test --test-modules tests/Api.Tests/bin/Debug/net10.0/Api.Tests.dll --no-build
      - name: Run integration tests
        run: |
          docker compose up -d --wait
          dotnet build tests/Api.IntegrationTests/Api.IntegrationTests.csproj
          dotnet test --test-modules tests/Api.IntegrationTests/bin/Debug/net10.0/Api.IntegrationTests.dll --no-build
      - name: Docker compose logs
        if: always()
        run: |
          docker compose logs

  publish:
    concurrency:
      group: cdp-release-publish
      cancel-in-progress: false
    name: CDP-publish-workflow
    needs: build # Sonar runs independently and does not gate publication.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release tag.
      id-token: write # Authenticate to AWS using OIDC.
    env:
      AWS_REGION: eu-west-2
      AWS_ACCOUNT_ID: "094954420758"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@dfb527d1bca7591fbbfd32ac007557745e888cf2 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud-scan:
    needs: validate
    if: needs.validate.outputs.should_publish == 'true'
    name: CDP SonarCloud Scan
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
