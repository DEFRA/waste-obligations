services:
  mongodb:
    image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  wiremock:
    pull_policy: always
    environment:
      TZ: Europe/London
    image: sheyenrath/wiremock.net:2.20.0@sha256:6b938666b50310222e83eb5217941ddaf410518250b29f9290ffcf415fe0f26c
    ports:
      - "9090:80"

  floci:
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    ports:
      - 4566:4566
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  floci-init:
    image: amazon/aws-cli:2.39.7@sha256:bba262340b0bc7cbf3a8a48612531263b56f4b280c4f036a07816af1b271bda0
    entrypoint: ["/bin/sh", "/compose/init-floci.sh"]
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - compose/aws.env
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    volumes:
      - ./compose/init-floci.sh:/compose/init-floci.sh:ro

  api:
    build:
      dockerfile: Dockerfile
    depends_on:
      floci:
        condition: service_healthy
      floci-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      wiremock:
        condition: service_started
    env_file:
      - compose/aws.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__DatabaseUri: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true&readPreference=secondaryPreferred
      PORT: 8080
      AWS_ENDPOINT_URL: http://floci:4566
      AWS__AuthenticationRegion: eu-west-2
      AWS__ServiceURL: http://floci:4566
      AWS_EMF_ENABLED: false
      AWS_EMF_ENVIRONMENT: Local
      AnalyticsAuditEventProcessor__ProcessingEnabled: true
      AnalyticsAuditEventProcessor__ProcessName: analytics
      AnalyticsAuditEventProcessor__TopicArn: arn:aws:sns:eu-west-2:000000000000:waste_obligations_analytics_events
      AnalyticsAuditEventProcessor__PollIntervalSeconds: 1
      AnalyticsAuditEventProcessor__PollJitterSeconds: 0
      AnalyticsAuditEventConsumer__QueueUrl: http://floci:4566/000000000000/waste_obligations_analytics_events_queue
      # See appsettings.json for additional settings related to auth
      PrnCommonBackend__TokenEndpoint: http://wiremock/oauth2/v2.0/token
      PrnCommonBackend__BaseAddress: http://wiremock/
      PrnCommonBackend__ClientId: prn-common-backend
      AccountBackend__TokenEndpoint: http://wiremock/oauth2/v2.0/token
      AccountBackend__BaseAddress: http://wiremock/
      AccountBackend__ClientId: account-backend
      WasteOrganisations__BaseAddress: http://wiremock/
      WasteOrganisations__ClientId: waste-organisations
      WastePackaging__BaseAddress: http://wiremock/
      OrganisationEligibility__RefreshPollingEnabled: false
      OrganisationObligationHydration__PollingEnabled: false
      GovukNotify__BaseAddress: http://wiremock/
      GovukNotify__ApiKey: dummyapikey-00000000-0000-0000-0000-000000000000-00000000-0000-0000-0000-000000000000
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  scheduled-job-api:
    extends:
      service: api
    environment:
      Mongo__DatabaseName: waste-obligations-scheduled-job-test
      AnalyticsAuditEventProcessor__ProcessingEnabled: false
      # The scenario creates instructions through the admin endpoint; only the processor runs here.
      ScheduledJobs__ObligationCalculation__Enabled: false
      ScheduledJobs__ObligationCalculation__Processing__Enabled: true
      ScheduledJobs__ObligationCalculation__Processing__PollIntervalSeconds: 1
    ports: !override
      - 8081:8080

volumes:
  mongodb-data:
